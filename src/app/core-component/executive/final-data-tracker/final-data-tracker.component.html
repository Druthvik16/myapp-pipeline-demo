<div class="card table-list-card" style="
    height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin: -15px -15px 10px -15px;
  ">
  <div class="card-header d-flex align-items-center justify-content-between flex-wrap p-2"
    style="gap: 0.5rem; row-gap: 0.5rem; min-height: auto">
    <div class="search-set d-flex align-items-center" style="gap: 1.5rem;">
      <h6 class="mb-0" style="white-space: nowrap; font-size: 18px; font-weight: 600;">Final Report</h6>
      <div style="border-left: 2px solid #e0e0e0; height: 28px; margin: 0 1rem;"></div>
      <div class="input-group input-group-sm">
        <button [ngClass]="
            isFilterActive
              ? 'btn btn-success btn-sm rounded ms-2'
              : 'btn btn-info btn-sm rounded ms-2'
          " (click)="openDateFilterModal()">
          <i [ngClass]="
              isFilterActive ? 'ti ti-filter-check' : 'fa fa-filter'
            "></i>
          {{ isFilterActive ? "Filter Active" : "Filter Options" }}
        </button>
        <button type="button" class="btn btn-sm rounded ms-2" [disabled]="!isAnyFilterActive()"
          (click)="clearAllFilters()" style="background-color: #ff6b6b; color: white">
          <i class="ti ti-x me-1"></i>Clear All Filters
        </button>
      </div>
    </div>
    <div class="d-flex my-xl-auto right-content align-items-center flex-wrap row-gap-3">
      <div class="page-btn">
        <a *ngIf="!downloadExcel" class="btn btn-success d-flex align-items-center" (click)="exportToExcel()"
          style="gap: 6px; font-weight: 500">
          <i class="fas fa-file-excel me-1"></i>
          Download
        </a>
        <a *ngIf="downloadExcel" class="btn btn-success d-flex align-items-center"
          style="gap: 6px; font-weight: 500; opacity: 0.8; pointer-events: none">
          <i class="fas fa-spinner fa-spin" style="font-size: 16px"></i>
          Downloading...
        </a>
      </div>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 0.5rem">
    <div class="ag-theme-alpine" style="width: 100%; height: 100%; font-size: 12px">
      <ag-grid-angular #agGrid style="width: 100%; height: 100%" [rowData]="filteredUploadedData"
        [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [gridOptions]="gridOptions"
        [suppressRowClickSelection]="true" [rowSelection]="'multiple'" [domLayout]="'normal'" class="ag-theme-alpine"
        (gridReady)="onGridReady($event)">
      </ag-grid-angular>
    </div>
  </div>
</div>

<ng-template #dateFilterModal let-modal>
  <div class="modal-content">
    <div class="modal-header py-2">
      <h6 class="mb-0">Advanced Filters</h6>
      <button type="button" class="close" (click)="modal.dismiss('cancelled')">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body overflow-auto" style="max-height: 80vh">
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Year
          <span class="spinner-border text-primary me-1 ms-2" style="width: 1rem; height: 1rem"
            *ngIf="isLoadYear"></span>
        </label>
        <div class="position-relative">
          <select class="form-select" aria-label="Select Year" [(ngModel)]="tempFilter.year"
            (change)="onYearChange($event)">
            <option [value]="null">All Years</option>
            <option [value]="year.year" *ngFor="let year of years">
              {{year.year}}</option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Month</label>
        <div class="position-relative">
          <select class="form-select" aria-label="Select Month" [(ngModel)]="tempFilter.month"
            (change)="onMonthChange($event)">
            <option [value]="null">All Months</option>
            <option [value]="month.month_no" *ngFor="let month of months">
              {{month.month}}</option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Created On</label>
        <div class="position-relative">
          <input type="text" bsDaterangepicker class="form-control form-control-sm" [bsConfig]="bsDateConfig"
            placeholder="Select Date Range" [(ngModel)]="tempFilter.dateRange"
            (bsValueChange)="onDateRangeChange($event)" placement="bottom" />
          <i *ngIf="tempFilter.dateRange"
            class="ti-close position-absolute top-50 translate-middle-y end-0 me-2 text-muted cursor-pointer"
            style="font-size: 0.9rem" (click)="tempFilter.dateRange = null; onDateRangeChange()"></i>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Brand
          <span class="spinner-border text-primary me-1 ms-2" style="width: 1rem; height: 1rem"
            *ngIf="isLoadBrand"></span>
        </label>
        <div class="position-relative">
          <select class="form-select" aria-label="Select Brand" [(ngModel)]="tempFilter.brand"
            (change)="onBrandChange($event)">
            <option [value]="null">All Brands</option>
            <option [value]="brand.brand_code" *ngFor="let brand of brands">
              {{brand.brand_code}}
            </option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Store Code
          <span class="spinner-border text-primary me-1 ms-2" style="width: 1rem; height: 1rem"
            *ngIf="isLoadStoreCode"></span>
        </label>
        <div class="position-relative">
          <select class="form-select" aria-label="Select Store Code" [(ngModel)]="tempFilter.storeCode"
            (change)="onStoreCodeChange($event)">
            <option [value]="null">All Store Codes</option>
            <option [value]="store.store_code" *ngFor="let store of storeCodes">
              {{store.store_code}}
            </option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Status
          <span class="spinner-border text-primary me-1 ms-2" style="width: 1rem; height: 1rem"
            *ngIf="isLoadStatus"></span>
        </label>
        <div class="position-relative">
          <select class="form-select" aria-label="Select Status" [(ngModel)]="tempFilter.status"
            (change)="onStatusChange($event)">
            <option [value]="null">All Status</option>
            <option [value]="st.state_name" *ngFor="let st of status">
              {{st.state_name}}
            </option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer  d-flex justify-content-end pt-2 pb-2 border-top">
      <button type="button" class="btn btn-sm btn-secondary me-2" (click)="resetTempDateFields(modal)">
        <i class="ti ti-rotate me-1"></i>Reset
      </button>
      <button *ngIf="!applyDateFilterClicked" type="button" class="btn btn-sm btn-success"
        (click)="applyDateFilter(modal)">
        <i class="ti ti-adjustments me-1"></i>Apply
      </button>
      <button *ngIf="applyDateFilterClicked" class="btn btn-sm btn-success" type="button">
        <i class="spinner-border text-primary me-1 ms-2"
          style="width: 1rem; height: 1rem"></i>Applying...
      </button>
    </div>
  </div>
</ng-template>
