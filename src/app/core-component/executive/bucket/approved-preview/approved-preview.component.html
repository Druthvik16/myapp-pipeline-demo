<div class="modal-content" style="flex-direction: column; height: 100vh">
  <div class="modal-header">
    <div class="page-title d-flex align-items-center gap-2">
      <h6 class="mb-0">
        Review and Scan Approved File -
        <span class="text-muted ms-2 text-dark p-1 rounded bg-gray-100">
          {{ fileName }}
        </span>
      </h6>
      <div *ngIf="loading" class="spinner-border text-primary" style="width: 1rem; height: 1rem"></div>
      <div *ngIf="isFileLocked" class="d-flex align-items-center gap-2 ms-4">
        <i class="fas fa-lock" style="color: #6f42c1" title="{{ lockMessage }}"></i>
        <small class="fw-bold" style="color: #6f42c1">{{ lockMessage }}</small>
      </div>
    </div>
    <button type="button" class="close" (click)="closeModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <!-- File Lock Status Alert -->
  <div *ngIf="isFileLocked" class="lock-banner m-2 mx-3">
    <div class="lock-banner-content">
      <i class="fas fa-lock me-2"></i>
      <span class="lock-message-text">{{ lockMessage }}</span>
      <small class="ms-2 lock-sub-text">• Please wait for editing to complete</small>
    </div>
  </div>

  <div class="modal-body-scrollable" style="flex: 1; overflow-y: auto; padding: 1rem">
    <div *ngIf="loading" class="loading-overlay">
      <em>Loading File...</em>
    </div>

    <div *ngIf="!loading && rowData.length === 0" class="text-center p-3">
      <em>No data available.</em>
    </div>

    <ag-grid-angular #agGrid *ngIf="!loading && rowData.length > 0" class="ag-theme-alpine excel-grid"
      style="width: 100%; height: 100%; overflow: auto" [gridOptions]="gridOptions" [columnDefs]="columnDefs"
      [rowData]="rowData" [pinnedTopRowData]="pinnedTopRowData" [defaultColDef]="defaultColDef"
      (gridReady)="onGridReady($event)" [autoSizeStrategy]="autoSizeStrategy" [enableCellTextSelection]="true">
    </ag-grid-angular>
  </div>
  <div *ngIf="userData?.user?.user_type != 'Team Lead'"
    class="modal-footer justify-content-center py-1 px-2 border-top">
    <!-- <button
      (click)="openScanningProcess()"
      type="button"
      class="btn btn-success"
      [disabled]="areButtonsDisabled"
      [title]="isFileLocked ? 'File is locked by another user' : 'Start scanning process'"
    >
      <i class="fas fa-play me-1"></i>
      Start Scan
    </button> -->
    <button (click)="openScanningProcess()" type="button" class="btn"
      [ngClass]="isScanning ? 'btn-warning' : 'btn-success'" [disabled]="areButtonsDisabled || isScanning" [title]="isFileLocked
    ? 'File is locked by another user'
    : isScanning
      ? 'Scanning in progress'
      : 'Start scanning process'">
      <i [ngClass]="isScanning ? 'fas fa-spinner fa-spin me-1' : 'fas fa-play me-1'"></i>
      {{ isScanning ? 'Scanning...' : 'Start Scan' }}
    </button>
  </div>
</div>
