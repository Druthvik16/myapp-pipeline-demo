<div class="modal-content" style="flex-direction: column; height: 100vh">
  <div class="modal-header">
    <div class="page-title d-flex align-items-center gap-2">
      <h6 class="mb-0">
        Select Header for Mapping -
        <span class="text-muted ms-2 text-dark p-1 rounded bg-gray-100">
          {{ fileName }}
        </span>
      </h6>
      <div
        *ngIf="loading"
        class="spinner-border text-primary"
        style="width: 1rem; height: 1rem"
      ></div>
      <div *ngIf="isFileLocked" class="d-flex align-items-center gap-2 ms-4">
        <i
          class="fas fa-lock"
          style="color: #6f42c1"
          title="{{ lockMessage }}"
        ></i>
        <small class="fw-bold" style="color: #6f42c1">{{ lockMessage }}</small>
      </div>
    </div>
    <button type="button" class="close" (click)="closeModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  
  <!-- Current Header Display -->
  <div class="d-flex justify-content-between align-items-center p-3 border-bottom">
    <div class="current-header-display">
      <div class="d-flex align-items-center gap-2">
        <span class="fw-semibold text-muted" style="font-size: 14px;">Current Header:</span>
        <span class="fw-bold text-primary px-2 py-1 rounded" style="font-size: 14px; background-color: #e3f2fd; border: 1px solid #2196f3;">
          {{ standardHeader || 'Not Selected' }}
        </span>
      </div>
    </div>
    
    <div *ngIf="userData?.user?.user_type != 'Team Lead'" class="d-flex gap-2">
      <button
        type="button"
        class="btn btn-warning btn-sm"
        *ngIf="isNAApplicable"
        (click)="mapNAHeader()"
      >
        <i class="feather icon-minus-circle me-1"></i>Map N/A
      </button>
      <button
        type="button"
        class="btn btn-success btn-sm"
        (click)="mapHeader()"
        [disabled]="!selectedHeaderChecked || !selectedHeader"
      >
        <i class="feather icon-arrow-right-circle me-1"></i>Map
      </button>
    </div>
  </div>
  <div
    class="modal-body-scrollable"
    style="flex: 1; overflow-y: auto; padding: 1rem"
  >
    <div class="table-responsive" style="height: 100%">
      <table class="table table-bordered text-center align-middle excel-table">
        <thead
          class="table-light"
          style="position: sticky; top: 0; z-index: 10"
          *ngIf="!loading && headerNames.length"
        >
          <tr>
            <th *ngFor="let header of headerNames">
              <label
                style="cursor: pointer"
                class="d-flex align-items-center justify-content-center gap-1"
              >
                <input
                  type="checkbox"
                  [checked]="
                    (header === selectedHeader && selectedHeaderChecked) ||
                    disabledHeaders.includes(header)
                  "
                  [disabled]="disabledHeaders.includes(header)"
                  (change)="toggleHeaderCheckbox($event, header)"
                />
                {{ header }}
              </label>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="loading">
            <td [attr.colspan]="headerNames.length + 1">
              <em>Loading File...</em>
            </td>
          </tr>
          <tr *ngIf="!loading && tableData.length === 0">
            <td [attr.colspan]="headerNames.length + 1">
              <em>No data available.</em>
            </td>
          </tr>
          <tr *ngFor="let row of tableData; let i = index">
            <td *ngFor="let header of headerNames">
              {{ row[header] }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
