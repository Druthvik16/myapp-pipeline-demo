<div class="modal-content" style="flex-direction: column; height: 100vh">
  <div class="modal-header">
    <div class="page-title d-flex align-items-center gap-2">
      <h6 class="fw-bold mb-0">
        Preview Of Uploaded File –
        <span class="text-dark ms-2 p-1 rounded bg-gray-200 fw-semibold">
          {{ fileName }}
        </span>
      </h6>
      <div
        *ngIf="loading"
        class="spinner-border text-primary"
        style="width: 1rem; height: 1rem"
      ></div>
    </div>
    <button type="button" class="close" (click)="closeModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div
    class="modal-body-scrollable"
    style="flex: 1; overflow-y: auto; padding: 1rem"
  >
    <div *ngIf="loading" class="loading-overlay">
      <em>Loading File...</em>
    </div>

    <div *ngIf="!loading && !fullData.length" class="text-center p-3">
      <em>No data available.</em>
    </div>

    <ag-grid-angular
      *ngIf="!loading && fullData.length > 0"
      #agGrid
      class="ag-theme-alpine"
      style="width: 100%; height: 100%; overflow: auto"
      [gridOptions]="gridOptions"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [rowData]="rowData"
      (gridReady)="onGridReady($event)"
      [pinnedTopRowData]="pinnedTopRowData"
    >
    </ag-grid-angular>
  </div>
</div>
