<div class="modal-content" style="flex-direction: column; height: 100vh">
  <div class="modal-header">
    <div class="page-title d-flex align-items-center gap-2">
      <h6 class="mb-0">
        Preview Of Discount Bucket -  
        <span class="text-dark ms-2 p-1 rounded bg-gray-200 fw-semibold">
          {{ batchName }}
        </span>
      </h6>
      <div *ngIf="loading" class="spinner-border text-primary" style="width: 1rem; height: 1rem"></div>
    </div>
    <button type="button" class="close" (click)="closeModal()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
  <div class="modal-body-scrollable" style="flex: 1; overflow-y: auto; padding: 1rem">
    <div *ngIf="loading" class="loading-overlay">
      <em>Loading Data...</em>
    </div>

    <div *ngIf="!loading && rowData.length === 0" class="text-center p-3">
      <em>No data available.</em>
    </div>

    <div *ngIf="!loading && rowData.length > 0" class="mb-3">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h6 class="mb-0">Total Records: {{ rowData.length }}</h6>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-sm rounded" [disabled]="!anyFilterActive" (click)="clearAllFilters()"
            style="background-color: #ff6b6b; color: white">
            <i class="fas fa-times me-1"></i> Clear All Filters
          </button>
          <button *ngIf="!downloadExcel" type="button" class="btn btn-primary btn-sm" (click)="bulkDownloadSoList()">
            <i class="fas fa-download me-1"></i>
            Bulk Download
          </button>

          <button type="button" class="btn btn-success btn-sm" [disabled]="downloadExcel || rowData.length === 0"
            (click)="exportToExcel()">
            <ng-container *ngIf="!downloadExcel; else downloadingExcel">
              <i class="fas fa-file-excel me-1"></i> Download Excel
            </ng-container>

            <ng-template #downloadingExcel>
              <div class="spinner-border spinner-border-sm me-1" role="status"></div>
              Downloading...
            </ng-template>
          </button>
        </div>
      </div>
    </div>

    <ag-grid-angular #agGrid *ngIf="!loading && rowData.length > 0" class="ag-theme-alpine excel-grid"
      style="width: 100%; height: 100%; overflow: auto" [gridOptions]="gridOptions" [columnDefs]="columnDefs"
      [rowData]="rowData" [pinnedTopRowData]="pinnedTopRowData" [defaultColDef]="defaultColDef"
      (gridReady)="onGridReady($event)" [autoSizeStrategy]="autoSizeStrategy" [enableCellTextSelection]="true">
    </ag-grid-angular>
  </div>
  <div class="modal-footer justify-content-center py-1 px-2 border-top">
    <button type="button" class="btn btn-secondary" (click)="closeModal()">
      <i class="feather icon-x me-1"></i> Close
    </button>
  </div>
</div>
