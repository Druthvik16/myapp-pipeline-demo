<div
  class="card table-list-card"
  style="
    height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin: -15px -15px 10px -15px;
  "
>
  <div
    class="card-header d-flex align-items-center justify-content-between flex-wrap p-2"
    style="gap: 0.5rem; row-gap: 0.5rem; min-height: auto"
  >
    <div class="search-set d-flex align-items-center" style="gap: 1.5rem;">
      <h6 class="mb-0" style="white-space: nowrap; font-size: 18px; font-weight: 600;">Data Tracking</h6>
      <div style="border-left: 2px solid #e0e0e0; height: 28px; margin: 0 1rem;"></div>
      <div class="input-group input-group-sm">
        <button [ngClass]="
            isFilterActive
              ? 'btn btn-success btn-sm rounded ms-2'
              : 'btn btn-info btn-sm rounded ms-2'
          " (click)="openDateFilterModal()">
          <i [ngClass]="
              isFilterActive ? 'ti ti-filter-check' : 'fa fa-filter'
            "></i>
          {{ isFilterActive ? "Filter Active" : "Filter Options" }}
        </button>
        <button type="button" class="btn btn-sm rounded ms-2" [disabled]="!isAnyFilterActive()"
          (click)="clearAllFilters()" style="background-color: #ff6b6b; color: white">
         <i class="ti ti-x me-1"></i> Clear All Filters
        </button>
      </div>
    </div>
    <div
      class="d-flex my-xl-auto right-content align-items-center flex-wrap row-gap-3"
    >
      <div class="page-btn">
        <a
          *ngIf="!downloadExcel"
          class="btn btn-success d-flex align-items-center"
          (click)="exportToExcel()"
          style="gap: 6px; font-weight: 500"
        >
          <i class="fas fa-file-excel me-1"></i>
          Download
        </a>
        <a
          *ngIf="downloadExcel"
          class="btn btn-success d-flex align-items-center"
          style="gap: 6px; font-weight: 500; opacity: 0.8; pointer-events: none"
        >
          <i class="fas fa-spinner fa-spin" style="font-size: 14px"></i>
          Downloading...
        </a>
      </div>
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; padding: 0.5rem">
    <div
      class="ag-theme-alpine"
      style="width: 100%; height: 100%; font-size: 12px"
    >
      <ag-grid-angular
        style="width: 100%; height: 100%"
        [rowData]="filteredUploadedData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [gridOptions]="gridOptions"
        [suppressRowClickSelection]="true"
        [rowSelection]="'multiple'"
        [domLayout]="'normal'"
        class="ag-theme-alpine"
        (gridReady)="onGridReady($event)"
      >
      </ag-grid-angular>
    </div>
  </div>
</div>

<ng-template #dateFilterModal let-modal>
  <div class="modal-content">
    <div class="modal-header py-2">
      <h6 class="mb-0">Advanced Filters</h6>
      <button type="button" class="close" (click)="modal.dismiss('cancelled')">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
    <div class="modal-body overflow-auto" style="max-height: 70vh">
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Year
          <span class="spinner-border text-primary me-1 ms-2" style="width: 1rem; height: 1rem" *ngIf="isLoadYear"></span>
        </label>
        <div class="position-relative">
          <select class="form-select mb-3" aria-label="Select Year"
          [(ngModel)]="tempYearUuid" (change)="getSelectedYear($event)">
           <option [value]="''">All Years</option>
            <option [value]="year.year" *ngFor="let year of years">
              {{year.year}}</option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Month</label>
        <div class="position-relative">
          <select class="form-select mb-3" aria-label="Select Month"
            [(ngModel)]="tempMonthUuid" (change)="getSelectedMonth($event)">
           <option [value]="''">All Months</option>
            <option [value]="month.month_no" *ngFor="let month of months">
              {{month.month}}</option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Brand
          <span
          class="spinner-border text-primary me-1 ms-2"
          style="width: 1rem; height: 1rem"
          *ngIf="isLoadBrand"
        ></span>
        </label>
        <div class="position-relative">
          <select class="form-select mb-3" aria-label="Select Brand"
            [(ngModel)]="tempBrandName">
           <option [value]="''">All Brands</option>
            <option [value]="brandName.brand_code" *ngFor="let brandName of brandNames">
              {{brandName.brand_code}}</option>
          </select>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Select Region
          <span class="spinner-border text-primary me-1 ms-2" style="width: 1rem; height: 1rem" *ngIf="isLoadRegion"></span>
        </label>
        <div class="position-relative">
          <select class="form-select mb-3" aria-label="Select Region"
            [(ngModel)]="tempRegionId" (change)="getSelectedRegion($event)">
           <option [value]="''">All Regions</option>
            <option [value]="region.region" *ngFor="let region of regions">
              {{region.region}}</option>
          </select>
        </div>
      </div>
    </div>

    <div class="modal-footer d-flex justify-content-end pt-2 pb-2 border-top">
      <button
        class="btn btn-sm btn-secondary me-2"
        (click)="resetTempDateFields(modal)"
        type="button"
      >
        <i class="ti ti-rotate me-1"></i>Reset
      </button>
      <button *ngIf="!applyDateFilterClicked"
        class="btn btn-sm btn-success"
        (click)="applyDateFilter(modal)"
        type="button"
      >
        <i class="ti ti-adjustments me-1"></i>Apply
      </button>
      
      <button *ngIf="applyDateFilterClicked"
        class="btn btn-sm btn-success"
        type="button"
      >
        <i class="spinner-border text-primary me-1 ms-2"
          style="width: 1rem; height: 1rem"></i>Applying...
      </button>
    </div>
  </div>
</ng-template>
