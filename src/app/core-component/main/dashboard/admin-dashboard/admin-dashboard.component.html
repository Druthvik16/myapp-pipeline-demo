  <div class="col-xl-3 col-sm-6 col-12 d-flex">
    <div class="card bg-primary sale-widget flex-fill">
      <div class="card-body d-flex align-items-center">
        <span class="sale-icon bg-white text-primary">
          <i class="ti ti-briefcase-2 fs-24"></i>
        </span>
        <div class="ms-2">
          <p class="text-white mb-1">Clients</p>
          <h4 class="text-white">{{clientCount}}</h4>
          <a
            role="button"
            class="badge badge-soft-primary d-flex align-items-center"
            [routerLink]="routes.client"
            style="cursor: pointer"
          >
            Show More <i class="ti ti-arrow-narrow-right ms-1"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
  <div class="col-xl-3 col-sm-6 col-12 d-flex">
    <div class="card bg-info sale-widget flex-fill">
      <div class="card-body d-flex align-items-center">
        <span class="sale-icon bg-white text-info">
          <i class="ti ti-building-store fs-24"></i>
        </span>
        <div class="ms-2">
          <p class="text-white mb-1">Customer/Store</p>
          <h4 class="text-white">{{storeCount}}</h4>
          <a
            role="button"
            class="badge badge-soft-primary d-flex align-items-center"
            [routerLink]="routes.storeMaster"
            style="cursor: pointer"
          >
            Show More <i class="ti ti-arrow-narrow-right ms-1"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
  <div class="col-xl-3 col-sm-6 col-12 d-flex">
    <div class="card bg-teal sale-widget flex-fill">
      <div class="card-body d-flex align-items-center">
        <span class="sale-icon bg-white text-teal">
          <i class="ti ti-users fs-24"></i>
        </span>
        <div class="ms-2">
          <p class="text-white mb-1">Users</p>
          <h4 class="text-white">{{usercount}}</h4>
          <a
            role="button"
            class="badge badge-soft-primary d-flex align-items-center"
            [routerLink]="routes.user"
            style="cursor: pointer"
          >
            Show More <i class="ti ti-arrow-narrow-right ms-1"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
