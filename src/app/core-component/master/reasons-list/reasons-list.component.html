<div class="page-header">
  <div class="add-item d-flex">
    <div class="page-title">
      <h4 class="d-flex align-items-center">
        Reasons
        <span class="badge rounded-pill badge-sm bg-primary ms-2">{{
          totalData
        }}</span>
        <span
          class="spinner-border text-primary me-1 ms-2"
          style="width: 1rem; height: 1rem"
          *ngIf="loadingReasons"
          role="status"
        ></span>
      </h4>
    </div>
  </div>
  <div class="page-btn">
    <a class="btn btn-primary"  (click)="openReasonAddModal()"
      ><i class="ti ti-circle-plus me-2"></i>Add Reason</a
    >
  </div>
</div>
<div class="card table-list-card">
  <div
    class="card-header d-flex align-items-center justify-content-between flex-wrap row-gap-3"
  >
    <div class="search-set">
      <div class="search-input">
        <a href="javascript:void(0);" class="btn btn-searchset"
          ><i class="ti ti-search fs-14 feather-search"></i
        ></a>
        <div class="dataTables_filter">
          <label>
            <input
              [(ngModel)]="searchDataValue"
              [ngModelOptions]="{ standalone: true }"
              [ngModelOptions]="{ standalone: true }"
              type="search"
              class="form-control form-control-sm"
              placeholder="Search"
              aria-controls="DataTables_Table_0"
            />
          </label>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="custom-datatable-filter table-responsive">
      <table class="table datatable">
        <thead class="thead-light">
          <tr >
            <th>S.No</th>
            <th >Code</th>
            <th>Remark</th>
            <th >Created On</th>
          </tr>
        </thead>
        <tbody>
          @for (data of tableData; track data) {
          <tr>
            <td>{{ data.sNo }}</td>
            <td>{{ data.code }}</td>
            <td>{{ data.remark }}</td>
            <td>{{ data.created_on | date : "dd/MM/yyyy"}}</td>
          </tr>
          } @if (tableData.length == 0) {
          <tr>
            <td colspan="12">
              <h5 class="no-record">No matching records found</h5>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
  <app-custom-pagination></app-custom-pagination>
</div>
