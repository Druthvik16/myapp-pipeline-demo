<div>
  <div class="">
    <div class="">
      <div class="modal-header">
        <div class="page-title">
          <h4>Add Reason</h4>
        </div>
        <button type="button" class="close" (click)="closeModal()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>

      <form [formGroup]="addReasonForm" (ngSubmit)="saveUser()">
        <div class="modal-body p-3">
          <div class="row">
            <div class="col-lg-12">
              <div class="mb-3">
                <label class="form-label"
                  >Reason<span class="text-danger ms-1">*</span></label
                >
                <input
                  type="text"
                  id="reason"
                  formControlName="reason"
                  class="form-control"
                  (input)="capitalizeReason()"
                  required
                  [ngClass]="{
                    'is-invalid':
                      addReasonForm.controls['reason'].invalid && !isValidForm
                  }"
                />
                <div
                  class="invalid-feedback"
                  *ngIf="
                    addReasonForm.controls['reason'].hasError('required') &&
                    !isValidForm
                  "
                >
                  Please enter reason
                </div>

                <div
                  class="invalid-feedback"
                  *ngIf="
                    addReasonForm.controls['reason'].hasError('pattern') &&
                    !isValidForm
                  "
                >
                  Only alphabet allowed with space 
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary me-2">
            <i class="feather icon-check me-1"></i>Save</button>
          <button
            type="button"
            class="btn btn-secondary"
            (click)="closeModal()"
          >
           <i class="feather icon-x me-1"></i> Cancel
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
