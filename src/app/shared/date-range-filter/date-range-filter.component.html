<div class="modal-content">
  <div class="modal-header py-2">
    <h6 class="mb-0">Filter by Date</h6>
    <button
      type="button"
      class="close"
      (click)="activeModal.dismiss('cancelled')"
    >
      <span>&times;</span>
    </button>
  </div>
  <div class="modal-body overflow-auto" style="max-height: 70vh">
    <div class="mb-4">
      <label class="form-label fw-semibold">Updated On</label>
      <div class="position-relative">
        <input
          type="text"
          class="form-control"
          bsDaterangepicker
          [bsConfig]="bsDateConfig"
          placeholder="Select Updated On Date Range"
          [(ngModel)]="tempUpdatedOnRange"
        />
        @if (tempUpdatedOnRange) {
        <i
          class="ti-close position-absolute top-50 translate-middle-y end-0 me-2 text-muted cursor-pointer"
          (click)="tempUpdatedOnRange = null"
        ></i>
        }
      </div>
    </div>

    <div class="mb-4">
      <label class="form-label fw-semibold">Uploaded On</label>
      <div class="position-relative">
        <input
          type="text"
          class="form-control"
          bsDaterangepicker
          [bsConfig]="bsDateConfig"
          placeholder="Select Uploaded On Date Range"
          [(ngModel)]="tempUploadedOnRange"
        />
        @if (tempUploadedOnRange) {
        <i
          class="ti-close position-absolute top-50 translate-middle-y end-0 me-2 text-muted cursor-pointer"
          (click)="tempUploadedOnRange = null"
        ></i>
        }
      </div>
    </div>
  </div>

  <div class="modal-footer d-flex justify-content-end pt-2 pb-2 border-top">
    <button class="btn btn-sm btn-secondary me-2" (click)="resetTempFields()">
     <i class="ti ti-rotate me-1"></i> Reset
    </button>
    <button class="btn btn-sm btn-success" (click)="applyFilters()">
      <i class="ti ti-adjustments me-1"></i>Apply
    </button>
  </div>
</div>
